<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de alvo e stop</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10); --chip: #f0efec;
    --pos: #2a78d6; --neg: #e34948; --good: #006300; --bad: #d03b3b;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --chip: #383835; --pos: #3987e5; --neg: #e66767; --good: #0ca30c;
      --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --chip: #383835; --pos: #3987e5; --neg: #e66767; --good: #0ca30c;
    --accent: #3987e5;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page); color: var(--ink); padding: 16px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1080px; margin: 0 auto;
  }
  h1 { font-size: 21px; margin-bottom: 4px; }
  .lead { color: var(--ink-2); font-size: 13.5px; margin-bottom: 16px; }
  a { color: var(--accent); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin-bottom: 3px; }
  .card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }

  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .control label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .control label b { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin: 14px 0; }
  .tile { background: var(--chip); border-radius: 11px; padding: 11px 13px; }
  .tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase;
       letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }
  .up { color: var(--good); font-weight: 700; }
  .down { color: var(--bad); font-weight: 700; }
  .scroll-x { overflow-x: auto; }

  .heat { border-collapse: separate; border-spacing: 2px; }
  .heat td, .heat th { padding: 5px 7px; border: none; border-radius: 5px; text-align: center; font-size: 11.5px; }
  .heat th { background: transparent; color: var(--muted); }
  .heat td { cursor: pointer; font-weight: 600; }
  .heat td.sel { outline: 2px solid var(--ink); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .loading { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>

<h1>Explorador de alvo e stop</h1>
<p class="lead">
  Arraste os controles e veja o resultado mudar na hora. Todas as combinações foram
  calculadas previamente sobre os 13 instrumentos — a página só troca entre resultados
  prontos, por isso responde na hora.
  <a href="index.html">← painel</a> · <a href="anatomia.html">anatomia</a>
</p>

<div id="app"><div class="loading">Carregando grade…</div></div>

<template id="tpl">
  <div class="card">
    <h2>Ajustes</h2>
    <div class="sub" id="base-desc">—</div>
    <div class="controls">
      <div class="control">
        <label>Alvo (múltiplo do risco) <b id="lbl-ratio">3,0×</b></label>
        <input type="range" id="sl-ratio" min="0" max="10" step="1" value="7">
        <div class="scale"><span>curto · acerta mais</span><span>longo · ganha mais</span></div>
      </div>
      <div class="control">
        <label>Largura do stop <b id="lbl-stop">1,00×</b></label>
        <input type="range" id="sl-stop" min="0" max="4" step="1" value="2">
        <div class="scale"><span>apertado · mão maior</span><span>largo · mão menor</span></div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">Replicação</div><div class="v" id="v-rate">—</div><div class="d" id="d-rate">instrumentos positivos</div></div>
      <div class="tile"><div class="k">PnL mediano</div><div class="v" id="v-median">—</div><div class="d">por instrumento</div></div>
      <div class="tile"><div class="k">PnL total</div><div class="v" id="v-total">—</div><div class="d">soma do universo</div></div>
      <div class="tile"><div class="k">Taxa de acerto</div><div class="v" id="v-win">—</div><div class="d" id="d-win">—</div></div>
      <div class="tile"><div class="k">Operações</div><div class="v" id="v-trades">—</div><div class="d">no universo</div></div>
    </div>
    <div class="note" id="breakeven">—</div>
  </div>

  <div class="card">
    <h2>Mapa da grade</h2>
    <div class="sub">Cor = PnL mediano · clique numa célula para ir até ela</div>
    <div class="scroll-x"><table class="heat" id="heat"></table></div>
  </div>

  <div class="card">
    <h2>Por instrumento</h2>
    <div class="sub" id="per-sub">—</div>
    <div class="scroll-x">
      <table>
        <thead><tr><th>Ativo</th><th class="num">PnL</th><th class="num">Trades</th><th class="num">Acerto</th><th class="num">Drawdown</th></tr></thead>
        <tbody id="per-symbol"></tbody>
      </table>
    </div>
  </div>
</template>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = v => (v < 0 ? "−" : "") + "R$ " + Math.abs(Math.round(v)).toLocaleString("pt-BR");
const dec = v => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let DATA = null;

function cellFor(ratio, stop) {
  return DATA.cells.find(c => c.ratio === ratio && c.stop_factor === stop);
}

function paintHeat(selected) {
  const values = DATA.cells.map(c => c.median_pnl);
  const max = Math.max(...values.map(Math.abs), 1);
  let html = "<tr><th></th>" + DATA.ratios.map(r => `<th>${dec(r)}×</th>`).join("") + "</tr>";
  for (const stop of DATA.stop_factors) {
    html += `<tr><th>stop ${dec(stop)}×</th>`;
    for (const ratio of DATA.ratios) {
      const cell = cellFor(ratio, stop);
      if (!cell) { html += "<td></td>"; continue; }
      const intensity = Math.min(1, Math.abs(cell.median_pnl) / max);
      const color = cell.median_pnl >= 0 ? "42,120,214" : "227,73,72";
      const isSel = selected && cell.ratio === selected.ratio && cell.stop_factor === selected.stop_factor;
      html += `<td class="${isSel ? "sel" : ""}" style="background:rgba(${color},${0.12 + intensity * 0.62});
        color:${intensity > 0.55 ? "#fff" : "var(--ink)"}"
        data-r="${ratio}" data-s="${stop}">${Math.round(cell.median_pnl / 100) / 10}k</td>`;
    }
    html += "</tr>";
  }
  $("heat").innerHTML = html;
  $("heat").querySelectorAll("td[data-r]").forEach(td => {
    td.onclick = () => {
      $("sl-ratio").value = DATA.ratios.indexOf(+td.dataset.r);
      $("sl-stop").value = DATA.stop_factors.indexOf(+td.dataset.s);
      render();
    };
  });
}

function render() {
  const ratio = DATA.ratios[+$("sl-ratio").value];
  const stop = DATA.stop_factors[+$("sl-stop").value];
  $("lbl-ratio").textContent = dec(ratio) + "×";
  $("lbl-stop").textContent = dec(stop) + "×";

  const cell = cellFor(ratio, stop);
  if (!cell) return;

  $("v-rate").textContent = Math.round(cell.rate * 100) + "%";
  $("v-rate").className = "v " + (cell.rate >= 0.7 ? "up" : (cell.rate < 0.5 ? "down" : ""));
  $("d-rate").textContent = `${cell.positive} de ${cell.tested} instrumentos`;
  $("v-median").textContent = fmt(cell.median_pnl);
  $("v-median").className = "v " + (cell.median_pnl >= 0 ? "up" : "down");
  $("v-total").textContent = fmt(cell.total_pnl);
  $("v-total").className = "v " + (cell.total_pnl >= 0 ? "up" : "down");
  $("v-win").textContent = Math.round(cell.win_rate * 100) + "%";
  $("v-trades").textContent = cell.trades.toLocaleString("pt-BR");

  // Acerto necessário para empatar com este payoff, ignorando custos
  const breakeven = 1 / (1 + ratio);
  $("d-win").textContent = `empate em ${Math.round(breakeven * 100)}%`;
  const margem = cell.win_rate - breakeven;
  $("breakeven").innerHTML =
    `Com alvo de ${dec(ratio)}× o risco, um mercado sem vantagem entregaria ` +
    `<b>${(breakeven * 100).toFixed(1)}%</b> de acerto. A estratégia entrega ` +
    `<b>${(cell.win_rate * 100).toFixed(1)}%</b> — ` +
    (margem >= 0
      ? `<b style="color:var(--good)">+${(margem * 100).toFixed(1)} pontos percentuais acima do acaso</b>.`
      : `<b style="color:var(--bad)">${(margem * 100).toFixed(1)} pontos percentuais, abaixo do acaso</b>.`);

  const rows = Object.entries(cell.per_symbol)
    .sort((a, b) => b[1].pnl - a[1].pnl)
    .map(([symbol, s]) => `<tr>
      <td>${symbol}</td>
      <td class="num ${s.pnl >= 0 ? "up" : "down"}">${fmt(s.pnl)}</td>
      <td class="num">${s.trades}</td>
      <td class="num">${Math.round(s.win_rate * 100)}%</td>
      <td class="num">${fmt(s.max_drawdown)}</td>
    </tr>`).join("");
  $("per-symbol").innerHTML = rows;
  $("per-sub").textContent = `${cell.tested} instrumentos · alvo ${dec(ratio)}× · stop ${dec(stop)}×`;

  paintHeat(cell);
}

async function load() {
  try {
    const resp = await fetch("rr_grid.json", { cache: "no-store" });
    if (!resp.ok) throw new Error();
    DATA = await resp.json();
  } catch {
    $("app").innerHTML = `<div class="card">Rode <code>python scripts/build_rr_grid.py</code>
      para gerar a grade.</div>`;
    return;
  }
  $("app").innerHTML = "";
  $("app").appendChild($("tpl").content.cloneNode(true));

  $("sl-ratio").max = DATA.ratios.length - 1;
  $("sl-stop").max = DATA.stop_factors.length - 1;
  $("sl-ratio").value = Math.max(0, DATA.ratios.indexOf(DATA.base.rr));
  $("sl-stop").value = DATA.stop_factors.indexOf(1.0);
  $("base-desc").textContent =
    `donchian canal ${DATA.base.channel} · somente compra · stop base ${DATA.base.stop_atr}×ATR · ` +
    `${DATA.universe.length} instrumentos · capital R$ ${DATA.capital.toLocaleString("pt-BR")}`;

  $("sl-ratio").oninput = render;
  $("sl-stop").oninput = render;
  render();
}
load();
</script>
</body>
</html>
