# Copie este arquivo para config.yaml e preencha com seus dados.
# config.yaml está no .gitignore e nunca deve ser versionado.

bot:
  # paper = simulado (sem dinheiro real) | live = conta real
  mode: paper
  # day_trade = abre e fecha posições no mesmo dia | swing_trade = mantém por dias
  style: day_trade

broker:
  name: metatrader5
  # Deixe login/senha vazios para usar a conta já logada no terminal MT5.
  # Preencha para o bot fazer o login sozinho (conta da corretora, ex.: XP, Clear, Rico).
  login: 0
  password: ""
  server: ""
  # Caminho do terminal64.exe (vazio = detecção automática)
  terminal_path: ""

market:
  # WIN e WDO são resolvidos automaticamente para o contrato vigente
  # (ex.: em ago/2026 → WINQ26 e WDOU26). Também aceita o código exato.
  symbols: [WIN, WDO]
  # Timeframe dos candles: 1m, 5m, 15m, 30m, 1h, 4h, 1d
  timeframe: 5m

risk:
  # Capital total disponível para o bot
  capital: 10000.0
  # Risco máximo por operação (% do capital)
  max_risk_per_trade_pct: 1.0
  # Perda máxima diária (% do capital) — o bot para de operar ao atingir
  max_daily_loss_pct: 3.0
  # Número máximo de posições abertas simultaneamente
  max_open_positions: 2
  # Máximo de trades por dia (0 = sem limite) — proteção contra overtrading
  max_trades_per_day: 5
  # Derrotas consecutivas que encerram o dia (0 = desativado)
  max_consecutive_losses: 3
  # Janela de operação (day trade) — fora dela o bot não abre posições
  trading_hours:
    start: "09:15"
    end: "17:30"
  # Zeragem: posições ainda abertas são fechadas neste horário
  flat_time: "17:45"

strategy:
  # Nome da estratégia ativa (deve existir em src/bot/strategies/)
  name: ""
  params: {}
