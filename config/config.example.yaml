# Copie este arquivo para config.yaml e ajuste. config.yaml está no
# .gitignore e nunca deve ser versionado.
#
# O bot opera a carteira APROVADA pelos testes de replicação:
# Donchian canal 20, só compra, candles diários, 13 futuros da B3,
# stop 2×ATR e alvo 3R anexados à ordem (o MT5 executa sozinho).
# Detalhes e evidência: commits do repositório + web/index.html.

carteira:
  # Capital de referência para o dimensionamento (não precisa ser o
  # saldo da conta — na demo o saldo é fictício)
  capital: 100000.0
  # Vagas de caixa simultâneas. O estudo de seleção mostrou zero
  # disputas em 4 anos com 8-10 vagas (scripts/slot_rule_study.py)
  slots: 10
  # Regra de desempate quando há mais sinais que vagas:
  # bloco (recomendada) | alfabetica | margem | aleatoria
  rule: bloco
  # Risco máximo por operação, em % do capital
  max_risk_per_trade_pct: 1.0
  # Perda realizada na semana que suspende entradas novas (% do capital)
  max_weekly_loss_pct: 6.0
  # Rola posições a N dias do vencimento (e não abre contrato mais curto)
  roll_days: 3
  # Parâmetros do Donchian — validados em 6/6 valores de canal;
  # não otimizar sem passar pelo processo de replicação
  channel: 20
  stop_atr: 2.0
  rr: 3.0
  # ⚠️ Conta REAL: o bot se recusa a operar se a conta não for demo,
  # a menos que isto seja true. Só ligue depois de meses de paper
  # trading limpo e com decisão consciente.
  allow_real: false
